# Render deployment. Free tier is sufficient: the deterministic engine needs no
# API key, no database and no persistent disk, and a 5,000-row batch reconciles
# in about 20 milliseconds.
#
# Built from the Dockerfile so the dashboard's Node build and the Python
# runtime come from one reproducible recipe; Render's native Python runtime
# does not guarantee a Node toolchain.
services:
  - type: web
    name: recon-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Origins allowed to call the API from a browser. The GitHub Pages site
      # is the one that needs it.
      - key: RECON_CORS_ORIGINS
        value: https://rahulpaul-07.github.io
      # Optional. With no key the model-backed endpoints say so plainly and
      # everything else works. Set it in the dashboard, never in this file.
      - key: ANTHROPIC_API_KEY
        sync: false
