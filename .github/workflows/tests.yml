name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite must not depend on one interpreter version. 3.10 is the
        # floor because the codebase uses PEP 604 unions (str | None).
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Deliberately not installing any provider SDK. The suite covers the
        # agent's constraints by calling them directly, so it must pass with
        # no model available and no network access.
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  agent-layers:
    # The MCP server, the LangGraph agent and the SQL layer. Kept out of the
    # `test` job on purpose: that job proves the engine needs no dependency
    # beyond its web layer, and these layers need mcp and langgraph. The SQL
    # layer also needs 3.11 (sqlite3.Connection.setlimit).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-agents.txt
      - name: Run the agent-layer tests
        # No model and no network: a scripted provider plays the model, and
        # the MCP server is exercised over a real stdio subprocess.
        run: python -m pytest tests_agents/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - name: Ruff (rules in pyproject.toml)
        run: ruff check src tests tests_agents scripts

  reconcile:
    # Proves the pipeline runs end to end from a clean checkout, not just that
    # the unit tests pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate a batch
        run: python src/generate_data.py --seed 42 --orders 120

      - name: Reconcile and grade against the answer key
        run: python src/evaluate.py --data data

      - name: Assert classification accuracy is total
        # A regression that lowers accuracy should fail the build rather than
        # quietly change a number in the README.
        run: |
          python src/evaluate.py --data data | tee result.txt
          grep -q "classified correctly  129 (100.0%)" result.txt

      - name: Assert no unseen defect class passes silently
        # The four blind spots the adversarial harness found are closed. A
        # change that reopens one fails here, not in a README line.
        run: |
          python src/evaluate.py --data datasets/08-unseen --detection | tee det.txt
          grep -q "silent pass      0" det.txt

      - name: Check variance across independent batches
        run: python src/evaluate.py --seeds 5 --orders 150

      - name: Build the report
        run: python src/report.py --data data --out report.html

  provider-degradation:
    # The system must run correctly with no language model configured. This job
    # deliberately sets no API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/generate_data.py --seed 42 --orders 120
      - name: Confirm no provider is available
        run: python src/llm.py | grep -q "deterministic paths only"
      - name: Confirm the engine still reconciles
        run: python src/evaluate.py --data data | grep -q "100.0%"

  web:
    # The dashboard must type-check and build, and the script that produces
    # its data must run end to end from a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Before the site data build: it counts the suite, and refuses to when
      # the web-layer tests would be skipped for want of FastAPI.
      - run: python -m pip install -r requirements-dev.txt
      - name: Site data builds
        run: python scripts/build_site_data.py --quick --out /tmp/site-data
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The built dashboard is served at /
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from fastapi.testclient import TestClient
          from app import app
          c = TestClient(app)
          r = c.get("/")
          assert r.status_code == 200 and '<div id="root">' in r.text, r.text[:200]
          # Prerendered: the opening text is in the HTML, not only in the bundle.
          assert "They never agree." in r.text, "index.html was not prerendered"
          assert c.post("/api/v1/datasets/01-reference").json()["grading"]["accuracy"] == 1.0
          PY
