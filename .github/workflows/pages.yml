name: pages

# Publishes the dashboard to GitHub Pages. The static build calls the live
# engine on Render for runs, uploads and generated batches, and falls back to
# the recorded snapshots in web/public/data when that is asleep or down.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    # The site's figures come from the engine, so an engine or dataset change
    # must republish it, not only a change to the dashboard code.
    paths: ["web/**", "src/**", "datasets/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the site data from the current engine
        # Committed snapshots can lag the code; the published figures must not.
        run: |
          python -m pip install pytest
          python scripts/build_site_data.py --out web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build for the Pages sub-path
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: https://recon-engine-yjim.onrender.com
        run: npm run build
      - name: Serve client-side routes
        # Pages has no rewrites; a copy of index.html as 404.html makes a
        # deep link load the app instead of GitHub's error page.
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
