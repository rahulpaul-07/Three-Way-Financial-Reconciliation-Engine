name: keepalive

# Render's free tier stops an instance after 15 minutes without traffic, and
# the next visitor waits 30 to 60 seconds for it to start. A request every 10
# minutes keeps it up, so the dashboard's live runs are instant.
#
# The trade-off: a service that never sleeps uses around 730 instance-hours a
# month against the free tier's 750, shared across all free services on the
# account. Delete this workflow, or widen the schedule, if that matters more
# than the wait. The site works either way; without the engine it falls back
# to the recorded snapshots.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the engine
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" \
              https://recon-engine-yjim.onrender.com/health) && \
              [ "$code" = "200" ] && echo "awake (HTTP $code)" && exit 0
            echo "attempt $i returned ${code:-no response}; retrying"
            sleep 20
          done
          # A cold start can outlast three attempts; that is not a failure
          # worth an email every ten minutes.
          echo "still starting; the next run will try again"
