name: keepalive

# Render's free tier stops an instance after 15 minutes without traffic, and
# the next visitor waits 30 to 60 seconds for it to start.
#
# This schedule alone does NOT keep it awake. GitHub treats cron as best
# effort and delays scheduled runs under load: asked for every 10 minutes,
# this workflow actually ran every 2 to 7 hours through September 2026, so the
# instance slept between runs and visitors met the cold start anyway.
#
# The primary keep-alive is an external uptime monitor sending HEAD /health
# every 5 to 10 minutes (see "Keeping the engine awake" in the README). This
# workflow is a backstop that costs nothing, and a record of the attempt.
#
# The trade-off of a service that never sleeps: around 730 instance-hours a
# month against the free tier's 750, shared across all free services on the
# account. The site works either way; without the engine it falls back to the
# recorded snapshots.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the engine
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" \
              https://recon-engine-yjim.onrender.com/health) && \
              [ "$code" = "200" ] && echo "awake (HTTP $code)" && exit 0
            echo "attempt $i returned ${code:-no response}; retrying"
            sleep 20
          done
          # A cold start can outlast three attempts; that is not a failure
          # worth an email every ten minutes.
          echo "still starting; the next run will try again"
